global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rbots
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/runner.token
    static_configs:
      - targets: ["127.0.0.1:2000"]
        labels:
          instance: rbots-server

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:9338"]
        labels:
          instance: cadvisor
