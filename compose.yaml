name: runelay-bots

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        APP_UID: ${BOTS_UID:-1000}
        APP_GID: ${BOTS_GID:-1000}
    image: ${BOTS_IMAGE:-runelay-bots-server:latest}
    container_name: ${BOTS_CONTAINER_NAME:-runelay-bots}
    network_mode: host
    init: true
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    shm_size: 2gb
    mem_limit: ${BOTS_MEM_LIMIT:-6g}
    memswap_limit: ${BOTS_MEM_LIMIT:-6g}
    cpus: ${BOTS_CPUS:-3}
    pids_limit: 4096
    ulimits:
      core: 0
    environment:
      GATEWAY_HOST: 127.0.0.1
      GATEWAY_PORT: ${GATEWAY_PORT:-2000}
      BOTS_DATA_DIR: /data
      BOTS_BACKUP_DIR: /backups
      BOTS_SCHEDULES: ${BOTS_SCHEDULES:-on}
      BOTS_MAX_TURNS: ${BOTS_MAX_TURNS:-3}
      VOICE_MAX_WARM: ${VOICE_MAX_WARM:-3}
      CODE_REPO_ROOTS: ${CODE_REPO_ROOTS:-${PROJECTS_DIR:-${HOME}/projects}}
      CODE_WORKTREES_DIR: ${CODE_WORKTREES_DIR:-${PROJECTS_DIR:-${HOME}/projects}/worktrees}
      CONTY_API_DIR: ${CONTY_API_DIR:-}
      VAULT_KEY_FILE: /run/runelay-bots/vault.key
    volumes:
      - ${PROJECTS_DIR:-${HOME}/projects}:${PROJECTS_DIR:-${HOME}/projects}
      - ${CODE_WORKTREES_DIR:-${PROJECTS_DIR:-${HOME}/projects}/worktrees}:${CODE_WORKTREES_DIR:-${PROJECTS_DIR:-${HOME}/projects}/worktrees}
      - ${BOTS_DATA_DIR:-${HOME}/.local/share/runelay-bots}:/data
      - ${BOTS_BACKUP_DIR:-${HOME}/.local/share/runelay-bots-backups}:/backups
      - ${BOTS_ENV_FILE:-./.env.local}:/app/apps/server/.env.local:ro
      - ${HOST_HOME:-${HOME}}/.claude:/home/app/.claude
      - ${HOST_HOME:-${HOME}}/.claude.json:/home/app/.claude.json
      - ${HOST_HOME:-${HOME}}/.codex:/home/app/.codex
      - ${HOST_HOME:-${HOME}}/.config/gh:/home/app/.config/gh
      - ${HOST_HOME:-${HOME}}/.supabase:/home/app/.supabase
      - ${HOST_HOME:-${HOME}}/.gitconfig:/home/app/.gitconfig:ro
      - ${DESKTOP_HOME_DIR:-desktop-home}:/home/runelaybot
      - ${VAULT_KEY_HOST_FILE:-${HOST_HOME:-${HOME}}/.config/runelay-bots/vault.key}:/run/runelay-bots/vault.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${GATEWAY_PORT}/bots || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  storage-secrets:
    image: ${BOTS_BUN_IMAGE:-oven/bun:1.4.4-alpine}
    command: ["bun", "/bootstrap/bootstrap.ts", "secrets"]
    environment:
      BOTS_UID: ${BOTS_UID:-1000}
      BOTS_GID: ${BOTS_GID:-1000}
    volumes:
      - ./deploy/garage:/bootstrap:ro
      - ${BOTS_STORAGE_DIR:-${HOME}/.local/share/runelay-bots/storage}:/var/lib/garage
    restart: "no"

  storage:
    image: dxflrs/garage:v2.5.0
    container_name: ${BOTS_STORAGE_CONTAINER_NAME:-runelay-bots-storage}
    user: ${BOTS_UID:-1000}:${BOTS_GID:-1000}
    restart: unless-stopped
    depends_on:
      storage-secrets:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3900:3900
    mem_limit: ${BOTS_STORAGE_MEM_LIMIT:-256m}
    memswap_limit: ${BOTS_STORAGE_MEM_LIMIT:-256m}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - ${BOTS_STORAGE_DIR:-${HOME}/.local/share/runelay-bots/storage}:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  storage-init:
    image: ${BOTS_BUN_IMAGE:-oven/bun:1.4.4-alpine}
    command: ["bun", "/bootstrap/bootstrap.ts", "setup"]
    user: ${BOTS_UID:-1000}:${BOTS_GID:-1000}
    depends_on:
      storage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://storage:3903
      BOTS_ENV_FILE_PATH: /env/.env.local
      GARAGE_CAPACITY_GB: ${BOTS_STORAGE_CAPACITY_GB:-100}
    volumes:
      - ./deploy/garage:/bootstrap:ro
      - ${BOTS_STORAGE_DIR:-${HOME}/.local/share/runelay-bots/storage}/secrets:/var/lib/garage/secrets:ro
      - ${BOTS_ENV_DIR:-.}:/env
    restart: "no"

volumes:
  desktop-home:
