name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  BUN_VERSION: 1.4.4

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version $version is not semver"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true; channel=beta ;;
            *) prerelease=false; channel=stable ;;
          esac
          {
            echo "version=$version"
            echo "minor=$(printf '%s' "$version" | cut -d. -f1,2)"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun test scripts/release/render-compose.test.ts

  images:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MINOR: ${{ needs.meta.outputs.minor }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            RBOTS_VERSION=${{ env.VERSION }}
            SOURCE_DATE_EPOCH=0
          labels: |
            org.opencontainers.image.title=r-bots
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          cache-from: type=gha,scope=r-bots
          cache-to: type=gha,mode=max,scope=r-bots
      - name: Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy.txt
          exit-code: "0"
      - name: Trivy summary
        if: always() && hashFiles('trivy.txt') != ''
        run: |
          {
            echo "### Trivy · r-bots (HIGH, CRITICAL)"
            echo
            echo '```'
            head -c 60000 trivy.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('trivy.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy
          path: trivy.txt
          retention-days: 30
      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        if: github.event.repository.private == false
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tags=("$IMAGE:$VERSION")
          if [ "$CHANNEL" = "stable" ]; then
            tags+=("$IMAGE:$MINOR" "$IMAGE:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$tag points to $got, expected $DIGEST"
              exit 1
            fi
          done
      - name: Layers
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          manifest="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
          docker buildx imagetools inspect "$IMAGE@$manifest" --raw > manifest.json
          if jq -e '[.layers[].mediaType] | any(. != "application/vnd.oci.image.layer.v1.tar+zstd")' manifest.json > /dev/null; then
            echo "::error::every layer must be zstd"
            jq -r '.layers[].mediaType' manifest.json | sort | uniq -c
            exit 1
          fi
          total="$(jq '[.layers[].size] | add' manifest.json)"
          {
            echo "### r-bots:$VERSION"
            echo
            echo "$(jq '.layers | length' manifest.json) camadas zstd, $((total / 1024 / 1024)) MB comprimidos."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [meta, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MINOR: ${{ needs.meta.outputs.minor }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.images.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Images list
        run: |
          mkdir -p dist
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/images.txt
      - run: bash scripts/release/pack.sh "$VERSION" dist
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums
        if: github.event.repository.private == false
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Release notes
        env:
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          SIGNED: ${{ github.event.repository.private == false }}
        run: |
          tags="\`$VERSION\`"
          if [ "$CHANNEL" = "stable" ]; then tags="$tags, \`$MINOR\`, \`latest\`"; fi
          {
            echo "## Imagem"
            echo
            echo "Uma imagem só para servidor, runner e caixa: \`$IMAGE:$VERSION\`."
            echo
            echo "Canal \`$CHANNEL\`. Tags: $tags. Só \`linux/amd64\`, camadas zstd (Docker 23 ou mais novo)."
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Leva SBOM e proveniência (SLSA, mode=max) e é assinada com cosign keyless. Para conferir:"
              echo
              echo '```sh'
              echo "cosign verify $IMAGE@$DIGEST \\"
              echo "  --certificate-identity $SERVER/$REPO/.github/workflows/release.yml@refs/tags/$TAG \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
              echo
              echo "O \`SHA256SUMS\` cobre todos os arquivos da release e tem assinatura em \`SHA256SUMS.sigstore.json\`:"
              echo
              echo '```sh'
              echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
              echo "  --certificate-identity $SERVER/$REPO/.github/workflows/release.yml@refs/tags/$TAG \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo "sha256sum -c SHA256SUMS"
              echo '```'
            else
              echo "Leva SBOM e proveniência (SLSA, mode=max). Sem assinatura cosign enquanto o repo é privado; confira os arquivos com:"
              echo
              echo '```sh'
              echo "sha256sum -c SHA256SUMS"
              echo '```'
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"
