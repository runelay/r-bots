name: mac

on:
  pull_request:
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"

permissions: {}

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SWIFT_IMAGE: swift:6.2.4-noble@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift-format lint
        run: |
          docker run --rm -v "$PWD/apps/mac:/src:ro" -w /src "$SWIFT_IMAGE" \
            swift format lint --strict --recursive --parallel Sources Tests Package.swift

  build:
    needs: format
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
