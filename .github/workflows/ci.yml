name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
        env:
          POSTGRES_USER: runelay_bots
          POSTGRES_PASSWORD: runelay_bots
          POSTGRES_DB: runelay_bots
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U runelay_bots -d runelay_bots"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://runelay_bots:runelay_bots@127.0.0.1:55432/runelay_bots
      TEST_REDIS_IMAGE: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --error-on-warnings .
      - run: bun run typecheck
      - name: Test postgres settings
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          for setting in "max_connections = 400" "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            docker exec "$PG" psql -v ON_ERROR_STOP=1 -U runelay_bots -d runelay_bots -c "ALTER SYSTEM SET $setting"
          done
          docker restart "$PG"
          timeout 60 sh -c "until docker exec \"$PG\" pg_isready -U runelay_bots -d runelay_bots; do sleep 1; done"
          docker exec "$PG" psql -U runelay_bots -d runelay_bots -tAc "show max_connections"
      - run: docker pull "$TEST_REDIS_IMAGE"
      - run: bun run test
      - run: bun test scripts/release

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          files=()
          while IFS= read -r -d '' file; do
            [ -f "$file" ] && [ ! -L "$file" ] || continue
            case "${file##*/}" in
              *.sh) files+=("$file") ;;
              *.*) ;;
              *)
                if LC_ALL=C head -c 128 "$file" | head -n 1 | grep -Eq '^#!.*[/ ](ba|da)?sh([[:space:]]|$)'; then
                  files+=("$file")
                fi
                ;;
            esac
          done < <(git ls-files -z)
          printf '%s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" --color=always "${files[@]}"
