version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories:
      - /apps/server
      - /packages/runner
      - /packages/runner/box
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: build
